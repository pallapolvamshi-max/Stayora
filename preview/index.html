      const [amenityFilter, setAmenityFilter] = useState(["WiFi", "Food"]);

      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [activePhoneTab, setActivePhoneTab] = useState("rooms");

      // Ref container for GSAP Context
      const mainRef = useRef(null);

      // --- Interactive Amenity Toggle ---
      const toggleAmenity = (name) => {
        if (amenityFilter.includes(name)) {
          setAmenityFilter(amenityFilter.filter(a => a !== name));
        } else {
          setAmenityFilter([...amenityFilter, name]);
        }
      };

      // --- Calculate Compatibility dynamically based on selected preferences ---
      const calculateCompatibility = () => {
        let base = 75;
        if (budget >= 6000 && budget <= 8500) base += 10;
        if (distance === "under1km") base += 8;
        if (personality === "nightowl" || personality === "introvert") base += 4;
        if (amenityFilter.length >= 3) base += 3;
        return Math.min(base, 99);
      };

        setLikedRoommates(prev => {
